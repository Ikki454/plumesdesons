<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F5F5F5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        .login-panel .logo {
            display: block;
            margin: 0 auto 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .login-panel h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        .login-panel label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .login-panel input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-panel button {
            width: 100%;
            padding: 10px;
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-panel button:hover {
            background: #005ea6;
        }
        .login-panel .signup-text {
            text-align: center;
            margin-top: 20px;
        }
        .login-panel .signup-link {
            color: #007acc;
            text-decoration: none;
        }
        .login-panel .signup-link:hover {
            text-decoration: underline;
        }
    </style>
    <script type="module" src="login.js"></script>

    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-panel">
        <img src="images/logo.png" alt="logo_plumesdeSons" class="logo" width="150" height="150">
        <h1 class="login-title">Connexion</h1>
        <form class="login-form" action="#" method="post">
            <label for="id">Identifiant</label>
            <input type="text" id="id" name="id" placeholder="Entrez votre identifiant" required>
            <label for="mdp">Mot de passe</label>
            <input type="mdp" id="mdp" name="mdp" placeholder="Entrez votre mot de passe" required>
            <button type="submit" class="submit-btn">Se connecter</button>
        </form>
        <p class="signup-text">
            <span class="signup-msg">Pas encore de compte ?</span>
            <a class="signup-link" href="login.html">Créez-en un</a>
        </p>
    </div>
</body>
</html>
